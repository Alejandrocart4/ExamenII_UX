services:
  tech_store_postgres:
    image: postgres:17
    container_name: tech_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tech_store_inventory
    ports:
      - "55432:5432"
    volumes:
      - tech_store_postgres_data:/var/lib/postgresql/data

volumes:
  tech_store_postgres_data:
